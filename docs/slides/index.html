<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ParaliSetu — Hack for Social Cause Pitch Deck</title>
  
  <link rel="stylesheet" href="dist/reset.css">
  <link rel="stylesheet" href="dist/reveal.css">
  <link rel="stylesheet" href="dist/theme/white.css">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --r-background-color: #f8fafc;
      --r-main-font: 'Plus Jakarta Sans', -apple-system, sans-serif;
      --r-heading-font: 'Plus Jakarta Sans', -apple-system, sans-serif;
    }
    .reveal {
      font-family: var(--r-main-font);
    }
    .slide-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .slide-img {
      max-width: 100%;
      max-height: 92vh;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.1);
      border: 1px solid #e2e8f0;
    }
    .nav-hint {
      position: fixed;
      bottom: 14px;
      left: 20px;
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      background: rgba(255, 255, 255, 0.9);
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid #e2e8f0;
      z-index: 100;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="reveal">
    <div class="slides">

      <!-- Slide 1: Problem & Proposed Solution -->
      <section data-transition="slide">
        <div class="slide-wrapper">
          <img class="slide-img" src="images/Problem_Proposed_Solution_Slide.png" alt="Slide 1: Problem & Proposed Solution">
        </div>
      </section>

      <!-- Slide 2: Technical Approach -->
      <section data-transition="slide">
        <div class="slide-wrapper">
          <img class="slide-img" src="images/Technical_Approach_Slide.png" alt="Slide 2: Technical Approach">
        </div>
      </section>

      <!-- Slide 3: Impact Potential -->
      <section data-transition="slide">
        <div class="slide-wrapper">
          <img class="slide-img" src="images/Impact_Potential_Slide.png" alt="Slide 3: Impact Potential">
        </div>
      </section>

      <!-- Slide 4: Feasibility and Risk Analysis -->
      <section data-transition="slide">
        <div class="slide-wrapper">
          <img class="slide-img" src="images/Feasibility_and_Risk_Analysis_Slide.png" alt="Slide 4: Feasibility and Risk Analysis">
        </div>
      </section>

      <!-- Slide 5: Team Composition & Engineering Division -->
      <section data-transition="slide">
        <div class="slide-wrapper">
          <img class="slide-img" src="images/Team_Slide.png" alt="Slide 5: Team Composition & Engineering Division">
        </div>
      </section>

      <!-- Slide 6: References & Research Ground Truth -->
      <section data-transition="slide">
        <div class="slide-wrapper">
          <img class="slide-img" src="images/References_Slide.png" alt="Slide 6: References & Research Ground Truth">
        </div>
      </section>

    </div>
  </div>

  <div class="nav-hint">
    Use ◄ ► Arrow Keys to Navigate  •  Press [F] for Fullscreen  •  Press [O] for Slide Overview
  </div>

  <script src="dist/reveal.js"></script>
  <script>
    Reveal.initialize({
      hash: true,
      slideNumber: 'c/t',
      width: 1920,
      height: 1080,
      margin: 0.04,
      minScale: 0.2,
      maxScale: 2.0,
      controls: true,
      progress: true,
      center: true,
      transition: 'slide'
    });
  </script>
</body>
</html>
